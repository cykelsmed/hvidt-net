<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hvidt</title>
<meta name="description" content="hvidt.net">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<style>
:root{--bg:#f3efe7;--dot:#1c2230;--hot:#d9480f;--line:rgba(28,34,48,.35);--muted:#5b6170}
@media (prefers-color-scheme:dark){:root{--bg:#0a0c11;--dot:#ece6da;--hot:#ffb347;--line:rgba(236,230,218,.35);--muted:#9a9eaa}}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.mail{position:fixed;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom));text-align:center;font:400 14px/1.4 ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;letter-spacing:.06em;color:var(--muted);pointer-events:none}
.mail a{color:inherit;text-decoration:none;pointer-events:auto;border-bottom:1px solid transparent;transition:border-color .2s}
.mail a:hover,.mail a:focus-visible{border-color:currentColor;outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
</style>
</head>
<body>
<h1 class="sr">hvidt.net</h1>
<canvas id="c" aria-hidden="true"></canvas>
<p class="mail">hvidt.net</p>
<script>
(() => {
  // The name drawn by ~1,500 dots. The pointer pushes them away and they spring back;
  // a tap scatters them into a constellation that slowly gathers again.
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const RM = matchMedia('(prefers-reduced-motion: reduce)');
  const DK = matchMedia('(prefers-color-scheme: dark)');
  const WORD = 'Hvidt', TARGET = 1500, STARS = 70;
  const FONT = px => `600 ${px}px "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif`;
  let W, H, dpr, n = 0, x, y, vx, vy, hx, hy, sx, sy, svx, svy, ph, dl, size = 2;
  let S = 0, sTarget = 0, scatterUntil = 0, raf = 0, last = 0, col = {};
  const P = { x: -1e4, y: -1e4, in: false, t0: 0, sx: 0, sy: 0 };

  function readColors() {
    const s = getComputedStyle(document.documentElement);
    for (const k of ['bg', 'dot', 'hot', 'line']) col[k] = s.getPropertyValue('--' + k).trim();
  }

  function layout(intro) {
    W = innerWidth; H = innerHeight; dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const fontPx = Math.min(W * 0.27, H * 0.36);
    const off = document.createElement('canvas'); off.width = W; off.height = H;
    const o = off.getContext('2d', { willReadFrequently: true });
    o.font = FONT(fontPx); o.textAlign = 'center';
    const m = o.measureText(WORD);
    o.fillText(WORD, W / 2, H * 0.47 + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2);
    const d = o.getImageData(0, 0, W, H).data;
    let area = 0; for (let i = 3; i < d.length; i += 16) if (d[i] > 128) area += 4;
    const s = Math.max(2.2, Math.sqrt(area / TARGET));
    size = Math.max(1.3, Math.min(2.8, s * 0.62));
    const pts = [];
    for (let py = 0; py < H; py += s) for (let px = 0; px < W; px += s) {
      const qx = Math.min(W - 1, Math.round(px + (Math.random() - 0.5) * s * 0.5));
      const qy = Math.min(H - 1, Math.round(py + (Math.random() - 0.5) * s * 0.5));
      if (d[(qy * W + qx) * 4 + 3] > 128) pts.push(qx, qy);
    }
    n = pts.length / 2;
    const F = () => new Float32Array(n);
    x = F(); y = F(); vx = F(); vy = F(); hx = F(); hy = F(); sx = F(); sy = F(); svx = F(); svy = F(); ph = F(); dl = F();
    for (let i = 0; i < n; i++) {
      hx[i] = pts[2 * i]; hy[i] = pts[2 * i + 1]; ph[i] = Math.random() * 6.28; dl[i] = Math.random();
      sx[i] = Math.random() * W; sy[i] = Math.random() * H;
      svx[i] = (Math.random() - 0.5) * 0.25; svy[i] = (Math.random() - 0.5) * 0.25;
      x[i] = intro ? sx[i] : hx[i]; y[i] = intro ? sy[i] : hy[i];
    }
    S = intro ? 1 : 0; sTarget = 0;
  }

  function step(k, t) {
    if (sTarget === 1 && t > scatterUntil) sTarget = 0;
    // Scatter quickly; return linearly, with each dot leaving the sky at its own moment.
    S = sTarget > S ? S + (1 - S) * 0.09 * k : Math.max(0, S - k / 200);
    const R = Math.max(70, Math.min(130, W * 0.12)), R2 = R * R;
    const damp = 0.88 ** k;
    for (let i = 0; i < n; i++) {
      // Stars drift slowly and wrap around the edges.
      sx[i] += svx[i] * k; sy[i] += svy[i] * k;
      if (sx[i] < 0) sx[i] += W; else if (sx[i] > W) sx[i] -= W;
      if (sy[i] < 0) sy[i] += H; else if (sy[i] > H) sy[i] -= H;
      const b = Math.sin(t * 0.0012 + ph[i]) * 0.6;
      let li = Math.min(1, Math.max(0, (S - dl[i] * 0.6) / 0.4)); li = li * li * (3 - 2 * li);
      const spring = 0.02 + 0.03 * (1 - li);
      const gx = hx[i] + b + (sx[i] - hx[i]) * li, gy = hy[i] + Math.cos(t * 0.001 + ph[i]) * 0.6 + (sy[i] - hy[i]) * li;
      vx[i] += (gx - x[i]) * spring * k; vy[i] += (gy - y[i]) * spring * k;
      if (P.in) {
        const dx = x[i] - P.x, dy = y[i] - P.y, d2 = dx * dx + dy * dy;
        if (d2 < R2 && d2 > 0.01) { const dd = Math.sqrt(d2), f = (1 - dd / R) ** 2 * 5 * k; vx[i] += dx / dd * f; vy[i] += dy / dd * f; }
      }
      vx[i] *= damp; vy[i] *= damp; x[i] += vx[i] * k; y[i] += vy[i] * k;
    }
  }

  function draw(t) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = col.bg; ctx.fillRect(0, 0, W, H);
    if (S > 0.04) {
      // Constellation lines between a sparse subset of "bright" stars.
      const step = Math.max(1, Math.floor(n / STARS)), idx = [];
      for (let i = 0; i < n; i += step) idx.push(i);
      ctx.strokeStyle = col.line; ctx.lineWidth = 0.7; ctx.globalAlpha = Math.min(1, S * 1.2) * 0.55;
      ctx.beginPath();
      for (let a = 0; a < idx.length; a++) {
        let b1 = -1, b2 = -1, d1 = 1e9, d2 = 1e9; const i = idx[a];
        for (let b = 0; b < idx.length; b++) {
          if (a === b) continue; const j = idx[b], dd = (x[i] - x[j]) ** 2 + (y[i] - y[j]) ** 2;
          if (dd < d1) { d2 = d1; b2 = b1; d1 = dd; b1 = j; } else if (dd < d2) { d2 = dd; b2 = j; }
        }
        const lim = Math.min(W, H) * 0.22; const L2 = lim * lim;
        if (b1 >= 0 && d1 < L2) { ctx.moveTo(x[i], y[i]); ctx.lineTo(x[b1], y[b1]); }
        if (b2 >= 0 && d2 < L2) { ctx.moveTo(x[i], y[i]); ctx.lineTo(x[b2], y[b2]); }
      }
      ctx.stroke(); ctx.globalAlpha = 1;
    }
    const h = size / 2;
    ctx.fillStyle = col.dot; ctx.beginPath();
    const hot = [];
    for (let i = 0; i < n; i++) {
      if (vx[i] * vx[i] + vy[i] * vy[i] > 1.4) { hot.push(i); continue; }
      ctx.rect(x[i] - h, y[i] - h, size, size);
    }
    ctx.fill();
    if (hot.length) { ctx.fillStyle = col.hot; ctx.beginPath(); for (const i of hot) ctx.rect(x[i] - h, y[i] - h, size, size); ctx.fill(); }
    if (S > 0.04) {
      // Bright stars twinkle a little larger.
      ctx.fillStyle = col.dot; const step = Math.max(1, Math.floor(n / STARS));
      for (let i = 0; i < n; i += step) { ctx.globalAlpha = S * (0.5 + 0.5 * Math.sin(t * 0.003 + ph[i])); ctx.beginPath(); ctx.arc(x[i], y[i], size * 1.3, 0, 6.2832); ctx.fill(); }
      ctx.globalAlpha = 1;
    }
  }

  function frame(t) {
    raf = requestAnimationFrame(frame);
    const k = Math.min(3, (t - last) / 16.67 || 1); last = t;
    step(k, t); draw(t);
  }
  function start() { if (!raf && !RM.matches && !document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); } }
  function stop() { cancelAnimationFrame(raf); raf = 0; }
  function still() {
    // Reduced motion: no animation; a tap toggles between the name and the night sky.
    for (let i = 0; i < n; i++) { x[i] = hx[i] + (sx[i] - hx[i]) * S; y[i] = hy[i] + (sy[i] - hy[i]) * S; vx[i] = vy[i] = 0; }
    draw(0);
  }
  function scatter() {
    if (RM.matches) { S = S > 0.5 ? 0 : 1; still(); return; }
    sTarget = 1; scatterUntil = performance.now() + 2600;
    for (let i = 0; i < n; i++) { vx[i] += (Math.random() - 0.5) * 9; vy[i] += (Math.random() - 0.5) * 9; }
  }

  cv.addEventListener('pointermove', e => { P.x = e.clientX; P.y = e.clientY; P.in = e.pointerType === 'mouse' || e.buttons > 0; });
  cv.addEventListener('pointerdown', e => { P.x = P.sx = e.clientX; P.y = P.sy = e.clientY; P.in = true; P.t0 = performance.now(); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointerup', e => {
    if (performance.now() - P.t0 < 350 && Math.hypot(e.clientX - P.sx, e.clientY - P.sy) < 10) scatter();
    if (e.pointerType !== 'mouse') P.in = false;
  });
  cv.addEventListener('pointerleave', () => { P.in = false; });
  cv.addEventListener('pointercancel', () => { P.in = false; });

  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (!innerWidth || !innerHeight) return; layout(false); if (RM.matches) still(); }, 120); });
  document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
  RM.addEventListener('change', () => { if (RM.matches) { stop(); S = 0; still(); } else start(); });
  DK.addEventListener('change', () => { readColors(); if (RM.matches) still(); });

  // Wait until the viewport has a size (hidden iframes and panes can report 0).
  (function boot() {
    if (!innerWidth || !innerHeight) return setTimeout(boot, 100);
    readColors(); layout(!RM.matches);
    if (RM.matches) still(); else start();
  })();
})();
</script>
</body>
</html>
